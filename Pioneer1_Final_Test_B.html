window.TEST_DATA = {"id": "pi1_final_b", "version": "Version B", "title": "Pioneer 1 Final Test — Version B", "subtitle": "End-of-Course CEFR Assessment (A2 → B1) · Oxford Solutions Pre-Intermediate 3rd Ed.", "targetMin": 120, "listeningMax": 22, "readingMax": 24, "langCheckMax": 29, "listening": [{"id": "L1", "tag": "L_TF", "title": "Part 1: Young Inventors Competition (True / False)", "instr": "Listen to an interview about a competition for young inventors. Choose True (T) or False (F). You may play each track up to 2 times.", "audio": "audio/ct19_part1.mp3", "type": "tf", "items": [{"id": "L1.1", "q": "Children aged 8–13 years old can enter the competition this year.", "ans": "F"}, {"id": "L1.2", "q": "Inventions can be original ideas or ways to make an old product better.", "ans": "T"}, {"id": "L1.3", "q": "When people first enter the competition, they don't have to build their inventions.", "ans": "T"}, {"id": "L1.4", "q": "There will be a TV programme about the competition.", "ans": "T"}, {"id": "L1.5", "q": "Dave's favourite recent invention is the 3D printer.", "ans": "F"}]}, {"id": "L2", "tag": "L_Match", "title": "Part 2: Five People Talking About Jobs (Matching)", "instr": "Listen to five people talking about jobs. Match sentences A–F with speakers 1–5. There is ONE extra sentence.", "audio": "audio/est3_track_2.29.mp3", "type": "match", "bank": ["A. Get experience with your family.", "B. Have a fun job abroad.", "C. Get all the information you need in advance.", "D. Avoid problems at work.", "E. Learn to work for yourself.", "F. Learn different ways to perform."], "choices": ["A", "B", "C", "D", "E", "F"], "items": [{"id": "L2.1", "q": "Speaker 1", "ans": "B"}, {"id": "L2.2", "q": "Speaker 2", "ans": "E"}, {"id": "L2.3", "q": "Speaker 3", "ans": "F"}, {"id": "L2.4", "q": "Speaker 4", "ans": "C"}, {"id": "L2.5", "q": "Speaker 5", "ans": "A"}]}, {"id": "L3", "tag": "L_LongTF", "title": "Part 3: History of Space Exploration (True / False)", "instr": "Listen to the talk about space exploration. Are the sentences True (T) or False (F)?", "audio": "audio/est5_track_3.16.mp3", "type": "tf", "items": [{"id": "L3.1", "q": "Galileo invented the telescope.", "ans": "F"}, {"id": "L3.2", "q": "Galileo immediately used the telescope to study space.", "ans": "T"}, {"id": "L3.3", "q": "The United States sent the first person into space.", "ans": "F"}, {"id": "L3.4", "q": "There was an astronaut in Vostok 1.", "ans": "T"}, {"id": "L3.5", "q": "A woman explored space before men landed on the Moon.", "ans": "T"}, {"id": "L3.6", "q": "Most spacecraft have successfully landed on Mars.", "ans": "F"}, {"id": "L3.7", "q": "The speaker thinks it's useful to land on Mars.", "ans": "T"}, {"id": "L3.8", "q": "The speaker is mainly describing the advantages of space exploration.", "ans": "F"}]}, {"id": "L4", "tag": "L_MCQ4", "title": "Part 4: Four Short Extracts (Multiple Choice)", "instr": "Listen to four short recordings and choose the correct answer (A–D).", "audio": "audio/est4_track_3.08.mp3", "type": "mcq", "items": [{"id": "L4.1", "q": "Where would you hear this announcement?", "opts": ["A. in a department store", "B. in a shopping centre", "C. in a camera shop", "D. in a clothes shop"], "ans": "A"}, {"id": "L4.2", "q": "Who is the announcement for?", "opts": ["A. the victims of a crime", "B. police investigating a crime", "C. people who know something about a crime", "D. visitors to an art gallery"], "ans": "C"}, {"id": "L4.3", "q": "What does Lucy do to save money?", "opts": ["A. She works every weekend.", "B. She doesn't buy many things.", "C. She never goes out.", "D. She works every day."], "ans": "B"}, {"id": "L4.4", "q": "What is Jake going to do?", "opts": ["A. tell someone about a job", "B. apply for a job", "C. work as a waiter", "D. make a phone call"], "ans": "A"}]}], "reading": [{"id": "R1", "tag": "R_MCQ1", "title": "Part 1: Lost in Australia (Multiple Choice)", "instr": "Read the article and choose the correct answer (A–D).", "type": "mcq", "passage": "<h4>Lost in Australia</h4><p>When eighteen-year-old British student Sam Woodhead left college, he dreamed of joining the army – but he decided to have a gap year and go travelling first. Sam was already a keen long-distance runner and was very fit and healthy, but he thought backpacking in Australia was great training for his future.</p><p>In December 2012, Sam arrived in Central Queensland and found a job on a cattle farm. The farm was in the middle of the countryside, and Sam was enjoying his life there. One Tuesday morning, only eight days after his arrival, he decided to go for a run. But Sam made some mistakes. He took a heavy backpack but only one bottle of water. He also didn't have a route, and he didn't know the landscape. After only two hours, he finished his water and realised he was lost. The temperature was close to 40°C and he was soon exhausted. After four or five hours, he decided to stop and spend the night in the outback.</p><p>The next morning, Sam didn't report for work. His employers checked his room. His backpack and running shoes were gone, but his mobile and wallet were there. They called the rescue services and then they called Sam's family in England. The rescue services sent helicopters to the area to try to find Sam, but there were a lot of trees and plants in the area so it was difficult for the pilots to see a person on the ground.</p><p>Meanwhile, Sam was trying to find his way back. He made an SOS emergency signal on the ground from all the clothes in his backpack, including a pair of colourful shorts. Then, on Friday morning, Sam heard two helicopters flying over him. He shouted and waved his arms, but of course they didn't see him, and they couldn't hear him because their engines were too noisy. Then, in the afternoon, a third helicopter flew right over the SOS signal. At first, the pilot didn't see anything, but the wind from the helicopter's engine picked up Sam's shorts, and the pilot suddenly spotted them. He searched the area again, and at last he found the missing student only four or five kilometres from the cattle farm. Sam went to a hospital in the nearby town, Longreach, to recover. He was lucky to be alive!</p>", "items": [{"id": "R1.1", "q": "Sam went backpacking because", "opts": ["A. he didn't know what to do with his life.", "B. he didn't like being a student.", "C. he wanted to become fit.", "D. he thought it would be good for his career plans."], "ans": "D"}, {"id": "R1.2", "q": "Sam got lost because", "opts": ["A. he didn't prepare well.", "B. his map was incorrect.", "C. the weather suddenly changed.", "D. he wasn't well."], "ans": "A"}, {"id": "R1.3", "q": "Sam's employers realised Sam was lost when", "opts": ["A. he called them from his mobile.", "B. they saw that all his money was gone.", "C. his family rang to speak to him.", "D. some of his things were missing."], "ans": "D"}, {"id": "R1.4", "q": "The rescue services found Sam after they", "opts": ["A. heard him shouting.", "B. saw him moving about.", "C. noticed his signal.", "D. decided to land."], "ans": "C"}, {"id": "R1.5", "q": "In the article, the author", "opts": ["A. gives advice on survival.", "B. describes an adventure that went wrong.", "C. advertises a rescue centre.", "D. tells the story of Sam's career."], "ans": "B"}]}, {"id": "R2", "tag": "R_MCQ2", "title": "Part 2: On Top of the World (Multiple Choice)", "instr": "Read the article and choose the correct answer (A–D).", "type": "mcq", "passage": "<h4>On top of the world</h4><p>In January 2015, Kevin Jorgeson and Tommy Caldwell climbed to the top of the Dawn Wall of El Capitan – a famous mountain in Yosemite National Park, USA. This is often described as the world’s most difficult rock climb. It took Jorgeson and Caldwell eighteen days to climb the 900 metres to the top! During this time, they hung tents off the rock, and ate and slept in them. The Dawn Wall is so difficult because there is nothing big for climbers to hold onto. Jorgeson and Caldwell had to climb by holding tiny pieces of rocks with the ends of their fingers. They used ropes to protect themselves from falling, but not to help them climb.</p><p>Kevin Jorgeson nearly didn't finish the climb. He found one part of the Dawn Wall extremely difficult. It took him seven days to do this part, and he fell eleven times. His fingers were damaged too, so he had to wait for them to get better before he could continue. But in the end, both men finished the climb together. It was an amazing achievement.</p><p>Only two weeks later, an ice climber called Will Gadd became the first person to climb a frozen part of the Niagara Falls. These falls, on the Niagara River between America and Canada, are the biggest waterfalls in North America. They are made of three separate waterfalls, and Gadd climbed the Horseshoe Falls, on the Canadian side. In winter, a part of these 50.9 metre falls freezes, and Gadd wanted to climb up the ice. But it was an extremely difficult climb. The ice was very thick in some places, but not in other places. And because only a part of the waterfall was frozen, a lot of water fell past Gadd as he climbed. Gadd knew that if he fell, he would probably die – but he got to the top.</p><p>But why do people want to do dangerous climbs like these? 'Dangerous situations are very exciting,' says climber Terrence Jones. 'They make you feel alive.' Humans have always looked for challenges, but many of the old challenges – like climbing Mount Everest – aren’t exciting enough for some climbers because so many people have already done them. 'Climbers like Caldwell and Gadd want to achieve more than anyone else,' says Jones, 'so that the world will read about them in the papers and see them on TV.'</p><p>One day people will complete all of the difficult climbs on Earth, so what will climbers do then? 'I don’t know,' says Jones. 'But perhaps one day far in the future people won’t climb on Earth. There are still mountains to climb on Mars!' This may never happen, of course, but one thing is certain: the search for adventure will not stop.</p>", "items": [{"id": "R2.1", "q": "What is true about the climb of the Dawn Wall?", "opts": ["A. The climbers couldn't sleep until they finished.", "B. The climbers completed it at the same time.", "C. Both climbers found it quite easy.", "D. Ropes helped both men to climb."], "ans": "B"}, {"id": "R2.2", "q": "The writer says that Will Gadd's climb was difficult because...", "opts": ["A. he got wet.", "B. it was in three parts.", "C. the ice was different in different places.", "D. it was extremely cold."], "ans": "C"}, {"id": "R2.3", "q": "Terrence Jones thinks that people do dangerous climbs because...", "opts": ["A. they feel lucky to be alive.", "B. they want to die.", "C. they like the excitement.", "D. they aren't afraid of anything."], "ans": "C"}, {"id": "R2.4", "q": "He suggests that in the future, some people...", "opts": ["A. will find more challenging climbs on Earth.", "B. may climb on other planets.", "C. will be more interested in space travel.", "D. won't want to climb mountains any more."], "ans": "B"}, {"id": "R2.5", "q": "What title would be best for this article?", "opts": ["A. Reaching the top of a mountain", "B. How to do an impossible climb", "C. Some climbers love a challenge", "D. My most difficult climb"], "ans": "C"}]}, {"id": "R3", "tag": "R_TF", "title": "Part 3: Hurricane in Jamaica (True / False)", "instr": "Read the text and decide if the sentences are True (T) or False (F).", "type": "tf", "passage": "<h4>Hurricane in Jamaica</h4><p>I was staying with my aunt and uncle in Jamaica when the hurricane came. They've lived in Jamaica all their lives so they know about hurricanes. I, on the other hand, was born in Britain because my parents came here when they were first married. They bought a house in London, found work, and my sister and I were born a few years later. Our parents always tell wonderful stories about Jamaica and we go there as often as we can. We love staying with our aunt and uncle in the north of the island. Last year, my sister started university and my parents were busy working, so they said I could go on my own, which meant the visit was even more exciting than usual.</p><p>I went in December, because between October and mid-December the weather isn't as hot, but it's still lovely. However, it's also the hurricane season during those months, so you have to watch out for that. Luckily, my aunt and uncle heard the warning on the radio before I arrived, and as a result, there was already lots of extra food and drink in the house. I was glad about that, as one of my favourite things about being in Jamaica is the food!</p><p>As soon as we saw the first signs of the hurricane, we closed the windows and the doors, and then we waited. The storm was a Category 1 hurricane, with heavy rain and winds of about 125 km/h. I played games and chatted with my cousins to pass the time, and we ate lots of food. But I remember the sound of the wind crashing around the house, day and night, and I felt quite scared. My aunt told me there was nothing to worry about and that they'd had worse storms than that, so I felt a bit better. While we waited, we listened to the news on the radio; there was some flooding on the roads and on farms, and some damage to buildings. The storm began on Monday, and then by Wednesday it was moving out to sea. So we weren't indoors for very long really, and afterwards, there was sunshine again!</p>", "items": [{"id": "R3.1", "q": "The writer used to live in Jamaica.", "ans": "F"}, {"id": "R3.2", "q": "Her parents are always positive about their home country.", "ans": "T"}, {"id": "R3.3", "q": "The writer was worried about going to Jamaica this time.", "ans": "F"}, {"id": "R3.4", "q": "Most hurricanes in Jamaica take place at the end of the year.", "ans": "T"}, {"id": "R3.5", "q": "The storm surprised the writer and her family.", "ans": "F"}, {"id": "R3.6", "q": "The writer was afraid for the whole time.", "ans": "F"}, {"id": "R3.7", "q": "The rain flooded their house.", "ans": "F"}, {"id": "R3.8", "q": "The hurricane lasted for less than a week.", "ans": "T"}]}, {"id": "R4", "tag": "R_Head", "title": "Part 4: The Crime of the Century (Paragraph Matching)", "instr": "Read the text and match statements A–G with paragraphs 1–6. There is ONE extra statement.", "type": "match", "passage": "<h4>The crime of the century</h4><p><strong>[1]</strong> This is the story of one of Britain's most famous crimes: the Great Train Robbery. In 1963, an English criminal called Bruce Reynolds had an idea for a crime. He wanted to rob the night mail train from Glasgow to London because he knew the train carried thousands of pounds. He also knew he couldn't work alone, so he called fifteen other criminals and told them about the job. He called it 'the big one'.</p><p><strong>[2]</strong> The gang bought a farmhouse in the middle of the countryside to escape to after the crime. They also found a criminal train driver to help them drive the train after they stopped it, and they organised trucks to carry the money. Then, on the night of the robbery, they put up false signals on the track and waited.</p><p><strong>[3]</strong> The train appeared at around 3 a.m. and stopped at the false signals. The train driver, Jack Mills, was confused, so he got out and went to the signals. The thieves hit him on the head and then boarded the train. But now they had a problem – they needed to move the train to a bridge to unload the money, but their criminal train driver didn't understand the controls – he couldn't drive the train!</p><p><strong>[4]</strong> The thieves decided to drag the driver, Jack Mills, back onto the train to help them. Then they had a surprise. There was more than the thousands of pounds they thought would be on the train – there was over two and a half million! In those days that was a huge amount of money.</p><p><strong>[5]</strong> The men drove the money to their farmhouse and decided to wait there until the police ended their investigation. But this was a huge crime, and the police were looking everywhere. At last, the thieves became worried. They left the farmhouse with the money, and when the police found the house, they also found the men's fingerprints everywhere. The investigation continued, and the police started to arrest people. Many of the train robbers went to prison for thirty years for their crime.</p><p><strong>[6]</strong> In April 1965, one of the gang members, Ronnie Biggs, escaped from prison. He lived in Australia with his wife and children, and then he went to Brazil. During this time, the newspapers wrote many stories about him. In 2001, he returned to Britain because he was very ill. He went back to prison, but then left again in 2009 and died in an old people's home. Many people have made films and written books about the Great Train Robbery. It is one of Britain's most famous crime stories.</p>", "bank": ["A. the problem the robbers had on the night of the robbery.", "B. why the thieves decided to work together.", "C. how their fame grew.", "D. what they found which was unexpected.", "E. how the thieves prepared for the robbery.", "F. how the men spent the money.", "G. how the thieves were discovered."], "choices": ["A", "B", "C", "D", "E", "F", "G"], "items": [{"id": "R4.1", "q": "Paragraph 1 tells you...", "ans": "B"}, {"id": "R4.2", "q": "Paragraph 2 tells you...", "ans": "E"}, {"id": "R4.3", "q": "Paragraph 3 tells you...", "ans": "A"}, {"id": "R4.4", "q": "Paragraph 4 tells you...", "ans": "D"}, {"id": "R4.5", "q": "Paragraph 5 tells you...", "ans": "G"}, {"id": "R4.6", "q": "Paragraph 6 tells you...", "ans": "C"}]}], "writing": [{"id": "W1", "title": "Task 1: Informal Invitation Email (10 marks · 60–80 words)", "minWords": 60, "maxWords": 80, "prompt": "Write a short email invitation to a friend, asking them to come on a camping weekend with you and a few other friends. Remember to include:<br>• the date, time and place of the weekend.<br>• suggestions for things to do.<br>• a request for your friend to bring something (e.g. tent, sleeping bag, cooking equipment)."}, {"id": "W2", "title": "Task 2: Formal Competition Letter (15 marks · 100–120 words)", "minWords": 100, "maxWords": 120, "prompt": "Imagine you are entering a competition for a new invention or design. Write a formal letter to the organiser (do not include addresses or date) in which you:<br>• explain why you are writing.<br>• describe your invention.<br>• say what inspired you.<br>• explain why you think it would be useful."}], "langCheck": [{"id": "LC1", "title": "Ex 1: Verb Forms (8 marks)", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "fill", "items": [{"id": "LC1.1", "q": "The concert ______ (not finish) until 10 p.m. last night.", "ans": ["didn't finish", "did not finish"]}, {"id": "LC1.2", "q": "We ______ (watch) a film when you phoned.", "ans": ["were watching"]}, {"id": "LC1.3", "q": "If I won £1,000,000, I ______ (get) a fast car for my dad.", "ans": ["would get", "'d get"]}, {"id": "LC1.4", "q": "Sally ______ (meet) her friends outside the cinema at 3 p.m.", "ans": ["is meeting", "is going to meet", "'s meeting", "'s going to meet"]}, {"id": "LC1.5", "q": "I ______ (never / eat) a better pizza than this one – it's amazing!", "ans": ["have never eaten", "'ve never eaten"]}, {"id": "LC1.6", "q": "Sheila and Diane were very late, so the lesson ______ (start) when they got to the classroom.", "ans": ["had started"]}, {"id": "LC1.7", "q": "Don't worry – I ______ (help) you with your homework.", "ans": ["'ll help", "will help"]}, {"id": "LC1.8", "q": "If Emma gets a part in the play, my sisters and I ______ (buy) tickets to see it.", "ans": ["will buy", "'ll buy"]}]}, {"id": "LC2", "title": "Ex 2: Sentence Transformation (7 marks)", "instr": "Complete the second sentence so that it has the same meaning as the first sentence. Use 1–3 words.", "type": "fill", "items": [{"id": "LC2.1", "q": "It's a good idea to wear a helmet when you ride a bike, but it isn't compulsory. → You ______ wear a helmet when you ride a bike, but it's a good idea.", "ans": ["don't have to", "do not have to", "needn't", "need not"]}, {"id": "LC2.2", "q": "I can't buy that phone because it isn't cheap enough. → I can't buy that phone because ______ expensive.", "ans": ["it's too", "it is too"]}, {"id": "LC2.3", "q": "Dan said, 'I don't know Rachel's email address.' → Dan said that he ______ Rachel's email address.", "ans": ["didn't know", "did not know"]}, {"id": "LC2.4", "q": "A robber has taken a gold necklace from the bank. → A gold necklace ______ from the bank.", "ans": ["has been taken"]}, {"id": "LC2.5", "q": "Your house is bigger than our house. → Our house isn't ______ your house.", "ans": ["as big as"]}, {"id": "LC2.6", "q": "Lottie arrived at the cinema five minutes before I got there. → When I got to the cinema, Lottie ______ five minutes earlier.", "ans": ["had arrived"]}, {"id": "LC2.7", "q": "We won't ask you any questions until you have read the information. → You ______ any questions until you have read the information.", "ans": ["won't be asked", "will not be asked"]}]}, {"id": "LC3", "title": "Ex 3: Compound Nouns (6 marks)", "instr": "Make compound nouns using one word from Box A (ice, seat, boarding, sun, murder, renewable) and one from Box B (burn, pass, caps, investigation, energy, belt).", "type": "fill", "items": [{"id": "LC3.1", "q": "It was very hot in Dubai and my dad got bad ______ on his face.", "ans": ["sunburn"]}, {"id": "LC3.2", "q": "I lost my ______ at the airport, so I couldn't get onto the plane.", "ans": ["boarding pass"]}, {"id": "LC3.3", "q": "In the future, ______ like solar power will be used more, and we won't burn fossil fuels.", "ans": ["renewable energy"]}, {"id": "LC3.4", "q": "You must wear a ______ when you're travelling in a car.", "ans": ["seatbelt", "seat belt"]}, {"id": "LC3.5", "q": "After the police found the dead body, they started a ______ .", "ans": ["murder investigation"]}, {"id": "LC3.6", "q": "My teacher told us that the polar ______ are melting because of global warming.", "ans": ["ice caps"]}]}, {"id": "LC4", "title": "Ex 4: Multiple-Choice Cloze — Shopping Centres (8 marks)", "instr": "Read the text and choose the correct word (A, B or C) for each gap 1–8.", "type": "mcq", "passage": "<p>Shopping centres have become a <strong>(1) ___</strong> more than just places to shop and look for bargains. They are places of entertainment <strong>(2) ___</strong> people meet and have fun. Some modern shopping centres are <strong>(3) ___</strong> big they can take days to explore properly. For example, the Cevahir Shopping and Entertainment Centre in Istanbul covers 420,000 square metres and is considered to be the <strong>(4) ___</strong> shopping centre in Europe. It has around 350 shops and 50 restaurants to choose from. And if you fancy <strong>(5) ___</strong> your friends in the evening, there are 12 cinemas, a bowling alley and even a roller coaster ride.</p><p>Another huge shopping centre is the Mall of the Emirates in Dubai. As well as around 700 shops and restaurants, you can go to Magic Planet, which is a mini theme park, <strong>(6) ___</strong> watch a film in one of the fourteen cinemas. And if that isn't enough, <strong>(7) ___</strong> about visiting Ski-Dubai, the world-famous indoor ski slope? Some people want <strong>(8) ___</strong> a more cultural experience. This is easy at the Mall of the Emirates. There is a Community Theatre and Arts Centre on the second floor of the building with a theatre, art galleries, a music school and a library.</p>", "items": [{"id": "LC4.1", "q": "Gap (1)", "opts": ["A. much", "B. lot", "C. few"], "ans": "B"}, {"id": "LC4.2", "q": "Gap (2)", "opts": ["A. where", "B. who", "C. which"], "ans": "A"}, {"id": "LC4.3", "q": "Gap (3)", "opts": ["A. as", "B. such", "C. so"], "ans": "C"}, {"id": "LC4.4", "q": "Gap (4)", "opts": ["A. large", "B. larger", "C. largest"], "ans": "C"}, {"id": "LC4.5", "q": "Gap (5)", "opts": ["A. meet", "B. meeting", "C. to meet"], "ans": "B"}, {"id": "LC4.6", "q": "Gap (6)", "opts": ["A. while", "B. but", "C. or"], "ans": "C"}, {"id": "LC4.7", "q": "Gap (7)", "opts": ["A. how", "B. where", "C. much"], "ans": "A"}, {"id": "LC4.8", "q": "Gap (8)", "opts": ["A. to have", "B. have", "C. having"], "ans": "A"}]}]};

<style>
:root{
  --bg:#f4f6f5; --paper:#ffffff; --ink:#111827; --ink2:#374151; --mute:#6b7280;
  --line:#d1d5db; --accent:#0f766e; --accent-soft:#e6f4f1; --warn:#b45309; --warn-soft:#fef3c7;
  --bad:#b91c1c; --bad-soft:#fee2e2; --ok:#15803d; --ok-soft:#dcfce7;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans)}
.hdr{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.04)}
.hdr-top{max-width:1120px;margin:0 auto;padding:12px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.brand{margin-right:auto}
.brand b{font-size:17px;color:var(--accent);display:block}
.brand span{font-size:12.5px;color:var(--mute)}
.who{display:flex;gap:8px;flex-wrap:wrap}
.who input{height:38px;padding:0 11px;border:1px solid var(--line);border-radius:8px;width:190px;font:inherit}
.who input.invalid{border-color:var(--bad);background:var(--bad-soft)}
.timer{font:700 18px/1 ui-monospace,monospace;color:var(--ink);min-width:96px;text-align:right}
.timer.over{color:var(--bad)}
.btn{height:38px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font:600 14px var(--sans);cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tabs{max-width:1120px;margin:0 auto;padding:0 14px;display:flex;gap:4px;overflow-x:auto;border-top:1px solid #eef0ef}
.tab{border:0;background:transparent;padding:10px 14px;border-bottom:3px solid transparent;font:600 14px var(--sans);color:var(--ink2);cursor:pointer;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab .cnt{font-size:11.5px;padding:1px 7px;border-radius:999px;background:#e5e7eb;margin-left:5px}
main{max-width:1040px;margin:0 auto;padding:22px 18px 90px}
.pane{display:none}.pane.on{display:block}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:18px}
.card h2{margin:0 0 6px;font-size:18px;color:var(--accent)}
.instr{margin:0 0 14px;color:var(--ink2);font-size:14px}
.audio-box{background:var(--accent-soft);border:1px solid #b5dfd7;border-radius:8px;padding:12px 14px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.audio-box button{height:34px;padding:0 14px;border-radius:6px;border:0;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.audio-box button:disabled{background:#9ca3af;cursor:not-allowed}
.audio-meta{font-size:13px;color:var(--ink2)}
.passage{background:#f9fafb;border-left:4px solid var(--accent);padding:14px 16px;border-radius:6px;margin-bottom:16px;font-size:14.5px}
.passage h4{margin:0 0 8px;color:var(--ink)}
.bank{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.bank div{margin:3px 0}
.qitem{padding:10px 0;border-bottom:1px solid #eef0ef}
.qitem:last-child{border-bottom:0}
.qtxt{font-weight:600;margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:10px 18px}
.opts label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:14.5px}
select.sel, input.fill{padding:6px 10px;border:1px solid var(--line);border-radius:6px;font:14.5px var(--sans);min-width:180px}
textarea.wbox{width:100%;min-height:190px;padding:12px;border:1px solid var(--line);border-radius:8px;font:15px/1.6 var(--sans);resize:vertical}
.wmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:6px}
.banner{padding:14px 16px;border-radius:8px;margin-bottom:16px;font-size:14px}
.banner.ok{background:var(--ok-soft);color:var(--ok);border:1px solid #86efac}
.banner.warn{background:var(--warn-soft);color:var(--warn);border:1px solid #fcd34d}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:16px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:14px;background:#f9fafb}
.stat small{display:block;color:var(--mute);font-size:12.5px}
.stat b{font-size:22px;color:var(--accent)}
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-top">
    <div class="brand">
      <b id="t-title"></b>
      <span id="t-sub"></span>
    </div>
    <div class="who">
      <input id="inp-name" type="text" placeholder="Họ và tên học viên *" autocomplete="name">
      <input id="inp-email" type="email" placeholder="Email học viên *" autocomplete="email">
    </div>
    <div class="timer" id="clock">00:00</div>
    <button class="btn primary" id="btn-submit" type="button">Nộp bài</button>
  </div>
  <nav class="tabs" id="nav-tabs">
    <button class="tab on" data-tab="listening" type="button">1. Listening <span class="cnt" id="cnt-l">0</span></button>
    <button class="tab" data-tab="reading" type="button">2. Reading <span class="cnt" id="cnt-r">0</span></button>
    <button class="tab" data-tab="writing" type="button">3. Writing <span class="cnt" id="cnt-w">0/2</span></button>
    <button class="tab" data-tab="lang" type="button">4. Language Check <span class="cnt" id="cnt-lc">0</span></button>
    <button class="tab" data-tab="result" type="button" style="margin-left:auto">Kết quả</button>
  </nav>
</header>

<main>
  <div id="pane-listening" class="pane on"></div>
  <div id="pane-reading" class="pane"></div>
  <div id="pane-writing" class="pane"></div>
  <div id="pane-lang" class="pane"></div>
  <div id="pane-result" class="pane"></div>
</main>

<script>
(function(){
  var D = window.TEST_DATA, CFG = window.CONFIG;
  var STORE_KEY = 'pi1_exam_state_' + D.id;
  var QUEUE_KEY = 'pi1_exam_queue_' + D.id;
  var S = loadState() || {
    name: '', email: '', answers: {}, audioPlays: {}, startTs: Date.now(), elapsedSec: 0, submitted: false, result: null
  };
  var activeAudio = null;

  function $(s){ return document.querySelector(s); }
  function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function loadState(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){ return null; } }
  function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }
  function norm(s){
    return String(s||'').trim().toLowerCase()
      .replace(/[’`]/g, "'")
      .replace(/\s+/g, ' ')
      .replace(/[.,!?]+$/g, '');
  }
  function countWords(s){
    var t = String(s||'').trim();
    return t ? t.split(/\s+/).length : 0;
  }

  $('#t-title').textContent = D.title;
  $('#t-sub').textContent = D.subtitle + ' · Target: ' + D.targetMin + ' mins';
  $('#inp-name').value = S.name;
  $('#inp-email').value = S.email;
  $('#inp-name').addEventListener('input', function(e){ S.name = e.target.value; e.target.classList.remove('invalid'); saveState(); });
  $('#inp-email').addEventListener('input', function(e){ S.email = e.target.value; e.target.classList.remove('invalid'); saveState(); });

  function renderSection(containerId, sections, kind){
    var root = $('#' + containerId);
    root.innerHTML = '';
    sections.forEach(function(sec){
      var card = document.createElement('div');
      card.className = 'card';
      var html = '<h2>' + sec.title + '</h2><p class="instr">' + sec.instr + '</p>';
      if (sec.audio) {
        var used = S.audioPlays[sec.id] || 0;
        var left = Math.max(0, CFG.MAX_AUDIO_PLAYS - used);
        html += '<div class="audio-box">'
          + '<button type="button" class="play-btn" data-sec="' + sec.id + '" data-src="' + sec.audio + '"' + (left <= 0 ? ' disabled' : '') + '>▶ Phát Audio</button>'
          + '<span class="audio-meta" id="ameta-' + sec.id + '">Số lượt nghe còn lại: <strong>' + left + '/' + CFG.MAX_AUDIO_PLAYS + '</strong> · File: <code>' + sec.audio + '</code></span>'
          + '</div>';
      }
      if (sec.passage) html += '<div class="passage">' + sec.passage + '</div>';
      if (sec.bank) {
        html += '<div class="bank">' + sec.bank.map(function(b){ return '<div>' + b + '</div>'; }).join('') + '</div>';
      }
      sec.items.forEach(function(it, idx){
        var val = S.answers[it.id] || '';
        html += '<div class="qitem">';
        if (it.passage) html += '<div class="passage">' + it.passage + '</div>';
        html += '<div class="qtxt">' + (idx + 1) + '. ' + it.q + '</div>';
        if (sec.type === 'tf') {
          html += '<div class="opts">'
            + '<label><input type="radio" name="' + it.id + '" value="T"' + (val==='T'?' checked':'') + '> True (T)</label>'
            + '<label><input type="radio" name="' + it.id + '" value="F"' + (val==='F'?' checked':'') + '> False (F)</label>'
            + '</div>';
        } else if (sec.type === 'mcq' || sec.type === 'short_mcq') {
          html += '<div class="opts">' + it.opts.map(function(o){
            var code = o.charAt(0).toUpperCase();
            return '<label><input type="radio" name="' + it.id + '" value="' + code + '"' + (val===code?' checked':'') + '> ' + o + '</label>';
          }).join('') + '</div>';
        } else if (sec.type === 'match') {
          html += '<select class="sel" data-id="' + it.id + '"><option value="">-- Chọn đáp án --</option>'
            + sec.choices.map(function(c){ return '<option value="' + c + '"' + (val===c?' selected':'') + '>' + c + '</option>'; }).join('')
            + '</select>';
        } else if (sec.type === 'fill') {
          html += '<input class="fill" type="text" data-id="' + it.id + '" value="' + val.replace(/"/g,'&quot;') + '" placeholder="Nhập câu trả lời...">';
        }
        html += '</div>';
      });
      card.innerHTML = html;
      root.appendChild(card);
    });
  }

  function renderWriting(){
    var root = $('#pane-writing');
    root.innerHTML = '';
    D.writing.forEach(function(w){
      var val = S.answers[w.id] || '';
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<h2>' + w.title + '</h2><div class="passage">' + w.prompt + '</div>'
        + '<textarea class="wbox" data-id="' + w.id + '" placeholder="Viết bài của bạn tại đây...">' + val.replace(/</g,'&lt;') + '</textarea>'
        + '<div class="wmeta"><span>Yêu cầu độ dài: ' + w.minWords + '–' + w.maxWords + ' từ</span><span id="wc-' + w.id + '">Số từ: <strong>' + countWords(val) + '</strong></span></div>';
      root.appendChild(card);
    });
  }

  renderSection('pane-listening', D.listening, 'L');
  renderSection('pane-reading', D.reading, 'R');
  renderWriting();
  renderSection('pane-lang', D.langCheck, 'LC');

  // Bind inputs
  document.addEventListener('change', function(e){
    if (S.submitted) return;
    if (e.target.type === 'radio' && e.target.name) {
      S.answers[e.target.name] = e.target.value;
      updateCounts(); saveState();
    } else if (e.target.matches('select.sel')) {
      S.answers[e.target.dataset.id] = e.target.value;
      updateCounts(); saveState();
    }
  });
  document.addEventListener('input', function(e){
    if (S.submitted) return;
    if (e.target.matches('input.fill')) {
      S.answers[e.target.dataset.id] = e.target.value;
      updateCounts(); saveState();
    } else if (e.target.matches('textarea.wbox')) {
      var id = e.target.dataset.id;
      S.answers[id] = e.target.value;
      var wc = $('#wc-' + id);
      if (wc) wc.innerHTML = 'Số từ: <strong>' + countWords(e.target.value) + '</strong>';
      updateCounts(); saveState();
    }
  });

  // Audio player with strict 2-play limit
  document.addEventListener('click', function(e){
    if (!e.target.matches('.play-btn')) return;
    var btn = e.target, secId = btn.dataset.sec, src = btn.dataset.src;
    var used = S.audioPlays[secId] || 0;
    if (used >= CFG.MAX_AUDIO_PLAYS) return;
    if (activeAudio && !activeAudio.paused) {
      alert('Vui lòng đợi đoạn audio đang phát kết thúc trước khi mở đoạn khác.');
      return;
    }
    var a = new Audio(src);
    activeAudio = a;
    btn.disabled = true;
    btn.textContent = 'Đang phát...';
    a.play().then(function(){
      S.audioPlays[secId] = used + 1;
      saveState();
      var left = Math.max(0, CFG.MAX_AUDIO_PLAYS - S.audioPlays[secId]);
      $('#ameta-' + secId).innerHTML = 'Đang phát... (Lượt còn lại sau lần này: <strong>' + left + '/' + CFG.MAX_AUDIO_PLAYS + '</strong>)';
    }).catch(function(){
      btn.disabled = false;
      btn.textContent = '▶ Phát Audio';
      alert('Không tải được file âm thanh: ' + src + '. Hãy kiểm tra lại thư mục audio/ trên GitHub Pages.');
    });
    a.onended = function(){
      var left = Math.max(0, CFG.MAX_AUDIO_PLAYS - (S.audioPlays[secId] || 0));
      $('#ameta-' + secId).innerHTML = 'Số lượt nghe còn lại: <strong>' + left + '/' + CFG.MAX_AUDIO_PLAYS + '</strong>';
      btn.textContent = left > 0 ? '▶ Phát lại Audio' : 'Đã hết lượt nghe';
      btn.disabled = left <= 0;
    };
  });

  // Tabs
  $$('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      $$('.tab').forEach(function(x){ x.classList.remove('on'); });
      $$('.pane').forEach(function(x){ x.classList.remove('on'); });
      t.classList.add('on');
      $('#pane-' + t.dataset.tab).classList.add('on');
      window.scrollTo(0, 0);
    });
  });

  function updateCounts(){
    function cnt(secs){
      var done = 0, tot = 0;
      secs.forEach(function(s){ s.items.forEach(function(i){ tot++; if (String(S.answers[i.id]||'').trim()) done++; }); });
      return done + '/' + tot;
    }
    $('#cnt-l').textContent = cnt(D.listening);
    $('#cnt-r').textContent = cnt(D.reading);
    $('#cnt-lc').textContent = cnt(D.langCheck);
    var wd = D.writing.filter(function(w){ return countWords(S.answers[w.id]||'') >= 20; }).length;
    $('#cnt-w').textContent = wd + '/' + D.writing.length;
  }
  updateCounts();

  // Clock
  setInterval(function(){
    if (S.submitted) return;
    S.elapsedSec++;
    var m = Math.floor(S.elapsedSec / 60), s = S.elapsedSec % 60;
    var el = $('#clock');
    el.textContent = (m<10?'0':'') + m + ':' + (s<10?'0':'') + s;
    if (m >= D.targetMin) el.classList.add('over');
  }, 1000);
  setInterval(saveState, CFG.AUTOSAVE_MS);

  function gradeGroup(secs){
    var raw = 0, max = 0, wrong = [], brk = [];
    secs.forEach(function(s){
      var sOk = 0, sTot = s.items.length;
      s.items.forEach(function(it){
        max++;
        var u = S.answers[it.id] || '';
        var ok = false;
        if (Array.isArray(it.ans)) {
          ok = it.ans.some(function(a){ return norm(a) === norm(u); });
        } else {
          ok = norm(u) === norm(it.ans);
        }
        if (ok) { raw++; sOk++; } else { wrong.push(it.id); }
      });
      brk.push((s.tag || s.id) + ': ' + sOk + '/' + sTot);
    });
    return { raw: raw, max: max, wrong: wrong, breakdown: brk.join(' | ') };
  }

  function submitExam(){
    var nm = $('#inp-name').value.trim(), em = $('#inp-email').value.trim();
    var ok = true;
    if (!nm) { $('#inp-name').classList.add('invalid'); ok = false; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { $('#inp-email').classList.add('invalid'); ok = false; }
    if (!ok) { alert('Vui lòng nhập đầy đủ Họ tên và Email hợp lệ ở thanh trên cùng trước khi nộp bài.'); return; }
    if (!confirm('Xác nhận nộp bài thi cuối khóa ' + D.version + '? Sau khi nộp bạn sẽ không thể chỉnh sửa câu trả lời.')) return;

    if (activeAudio && !activeAudio.paused) activeAudio.pause();
    var gL = gradeGroup(D.listening);
    var gR = gradeGroup(D.reading);
    var gLC = gradeGroup(D.langCheck);
    var l25 = Math.round((gL.raw / gL.max) * 250) / 10;
    var r25 = Math.round((gR.raw / gR.max) * 250) / 10;
    var lcPct = Math.round((gLC.raw / gLC.max) * 1000) / 10;
    var w1Text = S.answers.W1 || '', w2Text = S.answers.W2 || '';

    var payload = {
      submittedAt: new Date().toISOString(),
      testId: D.id,
      version: D.version,
      name: nm,
      email: em.toLowerCase(),
      attempt: 1,
      listeningRawStr: gL.raw + '/' + gL.max,
      listening25: l25,
      readingRawStr: gR.raw + '/' + gR.max,
      reading25: r25,
      langCheckRawStr: gLC.raw + '/' + gLC.max,
      langCheckPct: lcPct,
      listeningBreakdown: gL.breakdown,
      readingBreakdown: gR.breakdown,
      writingTask1Text: w1Text,
      writingTask1Words: countWords(w1Text),
      writingTask2Text: w2Text,
      writingTask2Words: countWords(w2Text),
      timeMinutes: Math.max(1, Math.round(S.elapsedSec / 60)),
      wrongItems: gL.wrong.concat(gR.wrong, gLC.wrong).join(', '),
      answersJson: JSON.stringify(S.answers)
    };

    S.submitted = true;
    S.result = payload;
    saveState();
    lockInputs();
    renderResult(payload, 'Đang gửi kết quả về Google Sheet của giáo viên...');
    document.querySelector('[data-tab="result"]').click();
    sendToSheet(payload);
  }

  function lockInputs(){
    $$('input, select, textarea, .play-btn').forEach(function(el){
      if (el.id !== 'inp-name' && el.id !== 'inp-email') el.disabled = true;
    });
    $('#btn-submit').disabled = true;
    $('#btn-submit').textContent = 'Đã nộp bài';
  }

  function sendToSheet(payload){
    var url = CFG.SHEET_ENDPOINT;
    if (!url || url.indexOf('PASTE_') === 0) {
      renderResult(payload, 'Lưu ý: Giáo viên chưa dán link Apps Script (/exec) vào SHEET_ENDPOINT. Kết quả đã được lưu tạm trên trình duyệt.');
      return;
    }
    fetch(url, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function(){
      renderResult(payload, 'Đã gửi kết quả thành công về bảng tính Google Sheet của giáo viên!');
    }).catch(function(){
      try { localStorage.setItem(QUEUE_KEY, JSON.stringify(payload)); } catch(e){}
      renderResult(payload, 'Mạng chập chờn — kết quả đã lưu trên máy. Bấm nút "Gửi lại kết quả" bên dưới khi có mạng.', true);
    });
  }

  function renderResult(p, msg, showRetry){
    var root = $('#pane-result');
    root.innerHTML = '<div class="card">'
      + '<h2>Xác nhận nộp bài — ' + p.version + '</h2>'
      + '<div class="banner ' + (showRetry ? 'warn' : 'ok') + '">' + msg + '</div>'
      + '<p>Học viên: <strong>' + p.name + '</strong> (' + p.email + ') · Thời gian làm bài: <strong>' + p.timeMinutes + ' phút</strong></p>'
      + '<div class="summary-grid">'
      + '<div class="stat"><small>Listening (Tự chấm)</small><b>' + p.listening25 + ' / 25</b><small>(' + p.listeningRawStr + ' câu đúng)</small></div>'
      + '<div class="stat"><small>Reading (Tự chấm)</small><b>' + p.reading25 + ' / 25</b><small>(' + p.readingRawStr + ' câu đúng)</small></div>'
      + '<div class="stat"><small>Language Check (Chẩn đoán)</small><b>' + p.langCheckPct + '%</b><small>(' + p.langCheckRawStr + ' câu đúng)</small></div>'
      + '<div class="stat"><small>Writing &amp; Speaking</small><b>Chờ GV chấm</b><small>W1: ' + p.writingTask1Words + ' từ · W2: ' + p.writingTask2Words + ' từ</small></div>'
      + '</div>'
      + '<p style="font-size:13.5px;color:var(--mute)">Điểm tổng 4 kỹ năng (/100), xếp trình độ CEFR chính thức và báo cáo PDF chi tiết sẽ được giáo viên gửi sau khi chấm xong Writing &amp; Speaking.</p>'
      + (showRetry ? '<button class="btn primary" id="btn-retry" type="button">Gửi lại kết quả về Google Sheet</button>' : '')
      + '</div>';
    if (showRetry) {
      $('#btn-retry').addEventListener('click', function(){ sendToSheet(p); });
    }
  }

  $('#btn-submit').addEventListener('click', submitExam);
  if (S.submitted && S.result) {
    lockInputs();
    renderResult(S.result, 'Bạn đã hoàn thành và nộp bài thi cuối khóa.');
  }
})();
</script>
</body>
</html>
